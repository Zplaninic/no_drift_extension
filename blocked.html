<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Locked — No Drift</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1115;
        color: #e6e8ec;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 500;
        color: #9aa1ad;
        margin: 0 0 0.5rem;
      }
      #site {
        color: #e6e8ec;
      }
      #countdown {
        font-size: 4rem;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        margin: 0.5rem 0;
      }
      #until {
        color: #9aa1ad;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span id="site"></span> is locked</h1>
      <div id="countdown">--:--:--</div>
      <div id="until"></div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
